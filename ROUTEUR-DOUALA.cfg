! =============================================================
! Configuration : R-DLA — Routeur du site de Douala (Agence)
! Projet : Infrastructure réseau multi-sites — Entreprise CK_237
! =============================================================
!
enable
configure terminal
hostname R-DLA
!
! ---------- Interface trunk vers SW-DLA ----------
interface GigabitEthernet0/0
 no shutdown
!
interface GigabitEthernet0/0.40
 encapsulation dot1Q 40
 ip address 192.168.11.1 255.255.255.128
!
interface GigabitEthernet0/0.50
 encapsulation dot1Q 50
 ip address 192.168.11.129 255.255.255.240
!
! ---------- Liaison WAN vers R-BFS (Bafoussam) ----------
interface Serial0/1/1
 ip address 192.168.10.178 255.255.255.252
 no shutdown
!
! ---------- Configuration des relai  (distribution automatique des adresse ip) ----------

 interface GigabitEthernet0/0/0.40
 ip helper-address 192.168.11.130
 exit
 interface GigabitEthernet0/0/0.50
 ip helper-address 192.168.11.130
 exit
!

!
! ---------- Routage dynamique EIGRP (interconnexion des sites) ----------
router EIGRP 10
 network 192.168.11.0 0.0.0.127 
 network 192.168.11.128 0.0.0.15  
 network 192.168.10.176 0.0.0.3   
!
!
end
