
 Configuration : R-BFS — Routeur du site de Bafoussam (Siège)
 Projet : Infrastructure réseau multi-sites — Entreprise CK_237

enable
configure terminal
hostname R-BFS



-Interface trunk vers SW-BFS -
interface GigabitEthernet0/0/0
 no shutdown
!
interface GigabitEthernet0/0/0.10
 encapsulation dot1Q 10
 ip address 192.168.10.161 255.255.255.240
 exit
!
interface GigabitEthernet0/0/0.20
 encapsulation dot1Q 20
 ip address 192.168.10.1 255.255.255.128
 exit
!
interface GigabitEthernet0/0/0.30
 encapsulation dot1Q 30
 ip address 192.168.10.129 255.255.255.224
 exit
!
- Liaison WAN vers R-DLA (Douala) -
interface Serial0/1/0
 ip address 192.168.10.177 255.255.255.252
 no shutdown
!
 - Configuration des relai  (distribution automatique des adresse ip) -

 interface GigabitEthernet0/0/0.10
 ip helper-address 192.168.10.30
 exit
 interface GigabitEthernet0/0/0.20
 ip helper-address 192.168.10.30
 exit
  interface GigabitEthernet0/0/0.30
 ip helper-address 192.168.10.30
 exit

!

! - Routage dynamique EIGRP (interconnexion des sites) -
router  EIGRP 10
 
 network 192.168.10.0   0.0.0.127 
 network 192.168.10.128 0.0.0.31  
 network 192.168.10.160 0.0.0.15  
 network 192.168.10.176 0.0.0.3   
!
- ACL de sécurité : isolation du VLAN Direction -

access-list 110 permit ip 192.168.10.128 0.0.0.31 192.168.10.160 0.0.0.15
access-list 110 deny   ip any 192.168.10.160 0.0.0.15
access-list 110 permit ip any any
exit
Interface GigabitEthernet0/O/0.10
ip access-group 110 out


!
end
