
 Configuration : SW-DLA — Commutateur du site de Douala
 Projet : Infrastructure réseau multi-sites — Entreprise CK_237

!
enable
configure terminal
hostname SW-DLA
!

      - Création des VLAN -
vlan 40
 name COMMERCIAL
vlan 50
 name SUPORT_TECHNIQUE
!
      - Ports d'accès : VLAN 40 - Commercial -
interface range FastEthernet0/1-3
 switchport mode access
 switchport access vlan 40
 exit
!
      - Ports d'accès : VLAN 50 - Support Technique (+ SRV-DLA) -
interface range FastEthernet0/4-6
 switchport mode access
 switchport access vlan 50
 exit
!
    - Lien trunk vers R-DLA -
interface FastEthernet0/7
 switchport mode trunk
 switchport trunk allowed vlan 40,50
 exit
!
    - Interface de gestion (SVI VLAN Support Technique) -
interface Vlan50
 ip address 192.168.11.140 255.255.255.240
 no shutdown
!
end
