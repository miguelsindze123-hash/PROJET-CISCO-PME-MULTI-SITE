
 Configuration : SW-BFS — Commutateur du site de Bafoussam
 Projet : Infrastructure réseau multi-sites — Entreprise CK_237

!
enable
configure terminal
hostname SW-BFS


!
   - Création des VLAN -
vlan 10
 name DIRECTION
vlan 20
 name COMPTABILITE
vlan 30
 name INFORMATIQUE
!
     - Ports d'accès : VLAN 10 - Direction -
interface range FastEthernet0/1-5
 switchport mode access
 switchport access vlan 10
 exit
!
      - Ports d'accès : VLAN 20 - Comptabilité -
interface range FastEthernet0/4-5
 switchport mode access
 switchport access vlan 20
 exit
!
     - Ports d'accès : VLAN 30 - Informatique (+ SRV-BFS) -
interface range FastEthernet0/6-8
 switchport mode access
 switchport access vlan 30
 exit
!
    - Lien trunk vers R-BFS -
interface FastEthernet0/9
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 exit
!
     - Interface de gestion (SVI VLAN Informatique) -
interface Vlan30
 ip address 192.168.10.158 255.255.255.224
 no shutdown
 exit


!
end
